name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-progress-note:
    # CLAUDE.md, "Work in checkpoints": PROGRESS.md is a working note and must never reach main.
    name: No PROGRESS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if PROGRESS.md exists
        run: |
          if [ -e PROGRESS.md ]; then
            echo "::error file=PROGRESS.md::Move anything lasting into the docs and delete PROGRESS.md before merging (CLAUDE.md, Work in checkpoints)."
            exit 1
          fi

  check:
    name: pytest, ruff, pyright (${{ matrix.os }}, Python ${{ matrix.python-version }})
    # Windows is the primary platform (CLAUDE.md, "Platform"); Linux keeps the code portable.
    runs-on: ${{ matrix.os }}
    env:
      # Warn whenever a file is opened without an encoding (PEP 597); pyproject.toml makes the
      # warning an error, so code that would read or write cp1252 on Windows fails everywhere.
      PYTHONWARNDEFAULTENCODING: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest
